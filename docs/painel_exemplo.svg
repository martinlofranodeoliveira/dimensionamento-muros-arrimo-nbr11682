<text x="745" y="615" font-size="13" fill="#94a3b8">Tensão Máxima (sigma_max): <tspan fill="#06b6d4" font-weight="bold">123.12 kPa</tspan> | Mínima: <tspan fill="#06b6d4">23.06 kPa</tspan></text>
