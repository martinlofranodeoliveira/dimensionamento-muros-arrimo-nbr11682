[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dimensionamento-muros-arrimo-nbr11682"
version = "1.0.0"
description = "Dimensionamento analítico determinístico de muros de contenção e arrimo conforme ABNT NBR 11682:2009 e NBR 6118:2023."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Lofrano Tecnologia", email = "contato@lofranotecnologia.com.br" },
    { name = "Martin Lofrano de Oliveira", email = "martin@lofranotecnologia.com.br" }
]
keywords = [
    "engenharia-civil",
    "geotecnia",
    "muros-de-arrimo",
    "contencoes",
    "estabilidade-de-encostas",
    "nbr11682",
    "nbr6118",
    "zero-float",
    "lofrano-tecnologia"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]

[project.scripts]
muros-arrimo-nbr11682 = "muros_arrimo_nbr11682.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
muros_arrimo_nbr11682 = ["py.typed"]
